<!DOCTYPE html>                                                                                    
<html lang="ja">                                                                                   
<head>                                                                                             
<meta charset="UTF-8">                                                                             
<meta name="viewport" content="width=device-width, initial-scale=1.0">                             
<title>英単語クイズ</title>                                                                             
<style>                                                                                            
    body {                                                                                          
        font-family: Meiryo, sans-serif;                                                            
        background-color: whitesmoke;                                                               
        margin: 0;                                                                                  
        padding: 30px;                                                                              
    }                                                                                               
    .quiz {                                                                                         
        max-width: 850px;                                                                           
        margin: auto;                                                                               
        background: white;                                                                          
        padding: 35px;                                                                              
        border-radius: 18px;                                                                        
        box-shadow: 0 5px 20px gray;                                                                
    }                                                                                               
    h1 {                                                                                            
        margin-top: 0;                                                                              
        color: navy;                                                                                
    }                                                                                               
    .info {                                                                                         
        color: gray;                                                                                
        margin-bottom: 25px;                                                                        
    }                                                                                               
    .japanese {                                                                                     
        font-size: 20px;                                                                            
        margin-bottom: 25px;                                                                        
        line-height: 1.7;                                                                           
    }                                                                                               
    .english {                                                                                      
        font-size: 25px;                                                                            
        line-height: 1.7;                                                                           
        margin-bottom: 25px;                                                                        
    }                                                                                               
    .blank {                                                                                        
        color: navy;                                                                                
        letter-spacing: 3px;                                                                        
    }                                                                                               
    input {                                                                                         
        width: 90%;                                                                                 
        max-width: 600px;                                                                           
        font-size: 22px;                                                                            
        padding: 12px;                                                                              
        border: 2px solid gray;                                                                     
        border-radius: 8px;                                                                         
    }                                                                                               
    button {                                                                                        
        font-size: 18px;                                                                            
        padding: 10px 22px;                                                                         
        margin: 12px 5px 0 0;                                                                       
        border: none;                                                                               
        border-radius: 8px;                                                                         
        cursor: pointer;                                                                            
    }                                                                                               
    #answerButton {                                                                                 
        background-color: navy;                                                                     
        color: white;                                                                               
    }                                                                                               
    #nextButton {                                                                                   
        background-color: lightgray;                                                                
    }                                                                                               
    #result {                                                                                       
        font-size: 20px;                                                                            
        font-weight: bold;                                                                          
        margin-top: 20px;                                                                           
        min-height: 30px;                                                                           
    }                                                                                               
    .score {                                                                                        
        font-size: 18px;                                                                            
        margin-top: 20px;                                                                           
    }                                                                                               
    select {                                                                                        
        font-size: 16px;                                                                            
        padding: 7px;                                                                               
    }                                                                                               
    .settings {                                                                                     
        margin-bottom: 25px;                                                                        
        padding: 18px;                                                                              
        background: #f3f5f8;                                                                        
        border-radius: 10px;                                                                        
    }                                                                                               
    .setting-title {                                                                                
        font-weight: bold;                                                                          
        margin-bottom: 12px;                                                                        
    }                                                                                               
    .unit-options {                                                                                 
        display: flex;                                                                              
        flex-wrap: wrap;                                                                            
        gap: 10px 18px;                                                                             
        margin-bottom: 16px;                                                                        
    }                                                                                               
    .unit-options label {                                                                           
        display: inline-flex;                                                                       
        align-items: center;                                                                        
        gap: 5px;                                                                                   
    }                                                                                               
    .unit-options input {                                                                           
        width: auto;                                                                                
        max-width: none;                                                                            
        margin: 0;                                                                                  
    }                                                                                               
    .unit-groups {
        display: grid;
        gap: 12px;
        margin-bottom: 16px;
    }

    .unit-group {
        border: 1px solid #d5dbe2;
        border-radius: 10px;
        background: white;
        overflow: hidden;
    }

    .unit-group > summary {
        padding: 12px 14px;
        cursor: pointer;
        font-weight: bold;
        background: #eef2f6;
        list-style-position: inside;
    }

    .unit-group[open] > summary {
        border-bottom: 1px solid #d5dbe2;
    }

    .group-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
    }

    .group-label input {
        width: auto;
        max-width: none;
        margin: 0;
    }

    .unit-group .unit-options {
        padding: 14px;
        margin-bottom: 0;
    }

    .setting-row {                                                                                  
        display: flex;                                                                              
        flex-wrap: wrap;                                                                            
        align-items: center;                                                                        
        gap: 8px;                                                                                   
    }                                                                                               
    .setting-row button {                                                                           
        margin: 0;                                                                                  
        background: #2e6b45;                                                                        
        color: white;                                                                               
    }                                                                                               

    @media screen and (min-width: 900px) {
        .quiz {
            max-width: 980px;
        }
        .japanese {
            font-size: 23px;
        }
        .english {
            font-size: 30px;
            line-height: 1.75;
        }
        input {
            font-size: 24px;
        }
    }
</style>                                                                                           
</head>                                                                                            
<body>                                                                                             
<div class="quiz">                                                                                 
    <h1>英単語クイズ</h1>                                                                               
    <div class="info">                                                                             
        例文の日本語を読んで、空欄に入る英単語・連語を入力してください。複数語の連語はスペースまたは「/」で区切って入力できます。                                                                
    </div>                                                                                         
    <div class="settings">                                                                         
        <div class="setting-title">出題するUnit（複数選択可）</div>
        <!-- ここに5UnitごとのグループがJavaScriptで自動生成されます -->
        <div id="unitGroupsContainer" class="unit-groups"></div>

        <div class="setting-row">                                                                  
            <label for="order">出題順：</label>                                                       
            <select id="order">                                                                    
                <option value="sequential">順番に出題</option>                                         
                <option value="random">ランダムに出題</option>                                           
            </select>                                                                              
            <button id="startButton" onclick="startQuiz()">開始</button>                            
        </div>                                                                                     
    </div>                                                                                         
    <div id="japanese" class="japanese"></div>                                                    
    <div id="english" class="english"></div>                                                      
    <input id="answer" type="text" autocomplete="off" placeholder="英単語を入力">                        
    <br>                                                                                           
    <button id="answerButton" onclick="checkAnswer()">答える</button>                                
    <button id="nextButton" onclick="nextQuestion()">次の問題</button>                                
    <div id="result"></div>                                                                       
    <div id="score" class="score"></div>                                                          
    <div id="finishOptions" style="display:none;">                                                                       
        <button id="retryWrongButton" class="primary" onclick="retryWrong()">間違った問題を解きなおす</button>
    </div>                                                                                         
</div>

let currentList = words.slice();                                                                    
let currentIndex = 0;                                                                               
let correct = 0;                                                                                    
let answered = false;                                                                               
let wrongQuestions = [];                                                                            

// ★5Unitごとのグループを自動計算して画面に生成する関数
function renderUnitGroups() {
    const container = document.getElementById("unitGroupsContainer");
    container.innerHTML = "";

    // 存在するUnitの番号を数値として昇順ソート
    const uniqueUnits = [...new Set(words.map(w => parseInt(w.unit)))].sort((a, b) => a - b);
    if (uniqueUnits.length === 0) return;

    // 5Unit単位（例: 116-120, 121-125...）の範囲グループを作成
    const minUnit = uniqueUnits[0];
    const maxUnit = uniqueUnits[uniqueUnits.length - 1];

    // グループの境界を決定（例：116スタートなら 116〜120、121〜125...）
    let currentGroupStart = minUnit;

    while (currentGroupStart <= maxUnit) {
        let currentGroupEnd = currentGroupStart + 4;
        
        // このグループ範囲に含まれるUnitが存在するか確認
        const unitsInGroup = uniqueUnits.filter(u => u >= currentGroupStart && u <= currentGroupEnd);

        if (unitsInGroup.length > 0) {
            const details = document.createElement("details");
            details.className = "unit-group";
            details.open = true;

            const groupTitle = `Unit ${currentGroupStart}〜${currentGroupEnd}`;

            details.innerHTML = `
                <summary>
                    <label class="group-label" onclick="event.stopPropagation()">
                        <input type="checkbox" class="group-checkbox" checked>
                        ${groupTitle}
                    </label>
                </summary>
                <div class="unit-options">
                    ${unitsInGroup.map(u => `<label><input type="checkbox" name="unit" value="${u}" checked> Unit ${u}</label>`).join("")}
                </div>
            `;

            container.appendChild(details);
        }

        currentGroupStart += 5;
    }

    // イベントリスナーの登録
    document.querySelectorAll('.group-checkbox').forEach(groupBox => {
        groupBox.addEventListener('change', function(event) {
            event.stopPropagation();
            const group = this.closest('.unit-group');
            group.querySelectorAll('input[name="unit"]').forEach(box => {
                box.checked = this.checked;
            });
            this.indeterminate = false;
        });
    });

    document.querySelectorAll('input[name="unit"]').forEach(box => {
        box.addEventListener('change', updateGroupCheckboxes);
    });

    updateGroupCheckboxes();
}

function updateGroupCheckboxes() {
    document.querySelectorAll('.unit-group').forEach(group => {
        const boxes = Array.from(group.querySelectorAll('input[name="unit"]'));
        const groupBox = group.querySelector('.group-checkbox');
        const checkedCount = boxes.filter(box => box.checked).length;

        if (checkedCount === 0) {
            groupBox.checked = false;
            groupBox.indeterminate = false;
        } else if (checkedCount === boxes.length) {
            groupBox.checked = true;
            groupBox.indeterminate = false;
        } else {
            groupBox.checked = false;
            groupBox.indeterminate = true;
        }
    });
}

function startQuiz() {                                                                              
    const selectedUnits = Array.from(                                                               
        document.querySelectorAll('input[name="unit"]:checked')                                    
    ).map(input => input.value);                                                                    

    if (selectedUnits.length === 0) {                                                               
        document.getElementById("result").textContent = "Unitを1つ以上選択してください。";                       
        return;                                                                                     
    }                                                                                               

    currentList = words.filter(word => selectedUnits.includes(word.unit));                          

    if (document.getElementById("order").value === "random") {                                      
        for (let i = currentList.length - 1; i > 0; i--) {                                          
            const j = Math.floor(Math.random() * (i + 1));                                         
            [currentList[i], currentList[j]] = [currentList[j], currentList[i]];                    
        }                                                                                           
    }                                                                                               

    currentIndex = 0;                                                                               
    correct = 0;                                                                                    
    answered = false;                                                                               
    wrongQuestions = [];                                                                            
    document.getElementById("finishOptions").style.display = "none";                                
    showQuestion();                                                                                 
}                                                                                                   

function showQuestion() {                                                                           
    const q = currentList[currentIndex];                                                            

    document.getElementById("japanese").textContent = q.jp;                                         
    document.getElementById("english").textContent = q.en;                                          
    document.getElementById("answer").value = "";                                                   
    document.getElementById("answer").focus();                                                      
    document.getElementById("result").textContent = "";                                             
    answered = false;                                                                               

    document.getElementById("score").textContent =                                                  
        `${currentIndex + 1} / ${currentList.length} 正解：${correct}`;                              
}                                                                                                   

function checkAnswer() {                                                                            
    if (answered) return;                                                                           

    const input = document.getElementById("answer").value.trim().replace(/\s*\/\s*/g, " ").replace(/\s+/g, " ");                                   
    const answer = currentList[currentIndex].answer.trim().replace(/\s*\/\s*/g, " ").replace(/\s+/g, " ");                                                

    if (input.toLowerCase() === answer.toLowerCase()) {                                                                         
        document.getElementById("result").textContent = "○ 正解！";                                    
        correct++;                                                                                  
    } else {                                                                                        
        document.getElementById("result").textContent =                                             
            `× 不正解 答え：${answer}`;                                                                 
        if (!wrongQuestions.includes(currentList[currentIndex])) {                                  
            wrongQuestions.push(currentList[currentIndex]);                                         
        }                                                                                           
    }                                                                                               

    answered = true;                                                                                

    document.getElementById("score").textContent =                                                  
        `${currentIndex + 1} / ${currentList.length} 正解：${correct}`;                              
}                                                                                                   

function nextQuestion() {                                                                           
    if (currentIndex < currentList.length - 1) {                                                    
        currentIndex++;                                                                             
        showQuestion();                                                                             
    } else {                                                                                        
        document.getElementById("result").textContent =                                             
            `終了！ ${currentList.length}問中 ${correct}問正解`;                                          
        document.getElementById("finishOptions").style.display = "block";                           
        document.getElementById("retryWrongButton").disabled = wrongQuestions.length === 0;         
        document.getElementById("retryWrongButton").textContent = "間違った問題を解きなおす";                   
    }                                                                                               
}                                                                                                   

function retryWrong() {                                                                             
    if (wrongQuestions.length === 0) return;                                                        
    currentList = wrongQuestions.slice();                                                           
    currentIndex = 0;                                                                               
    correct = 0;                                                                                    
    answered = false;                                                                               
    wrongQuestions = [];                                                                            
    document.getElementById("finishOptions").style.display = "none";                                
    showQuestion();                                                                                 
}                                                                                                   

document.getElementById("answer").addEventListener("keydown", function(event) {                     
    if (event.key === "Enter") {                                                                    
        if (!answered) {                                                                            
            checkAnswer();                                                                          
        } else {                                                                                    
            nextQuestion();                                                                         
        }                                                                                           
    }                                                                                               
});                                                                                                 

// 初期化処理：画面読み込み時に5Unit単位のグループを自動生成
renderUnitGroups();
showQuestion();                                                                                     
</script>
